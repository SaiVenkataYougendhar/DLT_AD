<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neural Glow Cyan Gradient -->
    <linearGradient id="neuralCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Radiomics Accent Amber -->
    <linearGradient id="radGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filter for Synaptic Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Radiomics Optical Reticle / Crosshair HUD Guide -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
  <circle cx="32" cy="32" r="15" fill="none" stroke="#3b82f6" stroke-width="0.75" opacity="0.3" />
  <line x1="32" y1="4" x2="32" y2="11" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="32" y1="53" x2="32" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="4" y1="32" x2="11" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="53" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Central Synaptic Brain Neural Network -->
  <!-- Left Hemisphere -->
  <path d="M 30,19 C 24,19 20,23 20,28 C 17,29 16,33 17,36 C 16,39 18,43 21,44 C 22,46 25,47 28,46 C 29,46 30,45 30,44 Z"
        fill="url(#neuralCyan)"
        opacity="0.9"
        filter="url(#glow)" />
  
  <!-- Right Hemisphere -->
  <path d="M 34,19 C 40,19 44,23 44,28 C 47,29 48,33 47,36 C 48,39 46,43 43,44 C 42,46 39,47 36,46 C 35,46 34,45 34,44 Z"
        fill="url(#neuralCyan)"
        opacity="0.9"
        filter="url(#glow)" />

  <!-- Longitudinal Cerebral Fissure (Center Divider) -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#0b0f19" stroke-width="1.5" stroke-linecap="round" />

  <!-- Neural Synapse Nodes (Connected Network) -->
  <circle cx="26" cy="26" r="1.5" fill="#ffffff" />
  <circle cx="23" cy="35" r="1.5" fill="#ffffff" />
  <circle cx="27" cy="41" r="1.5" fill="#ffffff" />
  <circle cx="38" cy="26" r="1.5" fill="#ffffff" />
  <circle cx="41" cy="35" r="1.5" fill="#ffffff" />
  <circle cx="37" cy="41" r="1.5" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.2" fill="#38bdf8" filter="url(#glow)" stroke="#ffffff" stroke-width="1" />

  <!-- Synaptic Connective Filaments -->
  <path d="M 26,26 L 32,32 L 38,26 M 23,35 L 32,32 L 41,35 M 27,41 L 32,32 L 37,41"
        stroke="#ffffff"
        stroke-width="0.8"
        stroke-linecap="round"
        opacity="0.85" />
</svg>

